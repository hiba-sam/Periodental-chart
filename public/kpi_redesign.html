<!DOCTYPE html>
<html lang="fr" class="antialiased text-gray-900 bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refonte KPI Parodontal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                        },
                        dentist: {
                            teal: '#14b8a6', // matching the + statut dentiste button
                            tealDark: '#0f766e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border-radius: 1rem;
        }
    </style>
</head>
<body class="p-8">

    <div class="max-w-7xl mx-auto space-y-6">
        
        <!-- Action Bar -->
        <div class="flex items-center justify-between">
            <div class="flex space-x-3">
                <button class="bg-[#0f8b8d] hover:bg-[#0c7375] text-white px-5 py-2.5 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Statut Dentiste
                </button>
                <button class="bg-[#0f8b8d] hover:bg-[#0c7375] text-white px-5 py-2.5 rounded-lg font-medium shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Statut Parodontal
                </button>
            </div>
            
            <div class="flex space-x-3">
                <!-- Grouped external actions smoothly -->
                <button class="bg-white border text-gray-700 hover:bg-gray-50 px-4 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Charger
                </button>
                <button class="bg-white border text-gray-700 hover:bg-gray-50 px-4 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Imprimer
                </button>
                <button class="bg-white border text-gray-700 hover:bg-gray-50 px-4 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-sm">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    Enregistrer
                </button>
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-medium shadow-sm transition-colors ml-2">
                    Historique complet
                </button>
            </div>
        </div>

        <!-- KPIs Grid (4 items) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-5">
            
            <!-- KPI 1 -->
            <div class="glass-card p-6 relative overflow-hidden group hover:shadow-lg transition-shadow">
                <div class="absolute top-0 right-0 p-4 opacity-10">
                    <svg class="w-16 h-16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-14h2v8h-2zm0 10h2v2h-2z"/></svg>
                </div>
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Indice de plaque</h3>
                <div class="flex items-end gap-3 mb-2">
                    <span class="text-4xl font-bold text-gray-800 tracking-tight">1.2</span>
                    <div class="flex items-center text-sm font-medium text-emerald-600 mb-1 bg-emerald-50 px-2 py-0.5 rounded">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        0.1 vs préc.
                    </div>
                </div>
                <div class="h-10 mt-4 w-full">
                    <canvas id="sparkline1"></canvas>
                </div>
            </div>

            <!-- KPI 2 (BAD) -->
            <div class="glass-card p-6 relative overflow-hidden group hover:shadow-lg transition-shadow border-l-4 border-l-red-500">
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Poches ≥ 5mm</h3>
                <div class="flex items-end gap-3 mb-2">
                    <span class="text-4xl font-bold text-gray-800 tracking-tight">14</span>
                    <div class="flex items-center text-sm font-medium text-red-600 mb-1 bg-red-50 px-2 py-0.5 rounded">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                        +2 vs préc.
                    </div>
                </div>
                <div class="h-10 mt-4 w-full">
                    <canvas id="sparkline2"></canvas>
                </div>
            </div>

            <!-- KPI 3 -->
            <div class="glass-card p-6 relative overflow-hidden group hover:shadow-lg transition-shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Saignement (BOP)</h3>
                <div class="flex items-end gap-3 mb-2">
                    <span class="text-4xl font-bold text-gray-800 tracking-tight">10<span class="text-2xl text-gray-500">%</span></span>
                    <div class="flex items-center text-sm font-medium text-emerald-600 mb-1 bg-emerald-50 px-2 py-0.5 rounded">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        5% vs préc.
                    </div>
                </div>
                <div class="h-10 mt-4 w-full">
                    <canvas id="sparkline3"></canvas>
                </div>
            </div>

            <!-- KPI 4 -->
            <div class="glass-card p-6 relative overflow-hidden group hover:shadow-lg transition-shadow">
                <h3 class="text-sm font-semibold text-gray-500 mb-1">Perte d'attache moy.</h3>
                <div class="flex items-end gap-3 mb-2">
                    <span class="text-4xl font-bold text-gray-800 tracking-tight">1.5<span class="text-2xl text-gray-500">mm</span></span>
                    <div class="flex items-center text-sm font-medium text-gray-500 mb-1 bg-gray-100 px-2 py-0.5 rounded">
                        <span class="mr-1 text-lg leading-none">=</span>
                        Stable
                    </div>
                </div>
                <div class="h-10 mt-4 w-full">
                    <canvas id="sparkline4"></canvas>
                </div>
            </div>

        </div>

        <!-- Main Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="glass-card p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Tendance Saignement (BOP)</h2>
                <div class="relative h-64 w-full">
                    <canvas id="chart1"></canvas>
                </div>
            </div>

            <div class="glass-card p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Réduction Poches Profondes (≥5mm)</h2>
                <div class="relative h-64 w-full">
                    <canvas id="chart2"></canvas>
                </div>
            </div>

            <!-- Changed duplicate title to something more logical like Plaque Index Evolution -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Évolution Indice de Plaque</h2>
                <div class="relative h-64 w-full">
                    <canvas id="chart3"></canvas>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Sparklines Configurations
        const sparklineOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false }, tooltip: { enabled: false } },
            scales: { x: { display: false }, y: { display: false } },
            elements: { point: { radius: 0 }, line: { tension: 0.4, borderWidth: 2 } }
        };

        new Chart(document.getElementById('sparkline1').getContext('2d'), {
            type: 'line', data: { labels: ['T-3', 'T-2', 'T-1', 'Actuel'], datasets: [{ data: [1.8, 1.5, 1.3, 1.2], borderColor: '#10b981' }] }, options: sparklineOptions
        });
        new Chart(document.getElementById('sparkline2').getContext('2d'), {
            type: 'line', data: { labels: ['T-3', 'T-2', 'T-1', 'Actuel'], datasets: [{ data: [8, 10, 12, 14], borderColor: '#ef4444' }] }, options: sparklineOptions
        });
        new Chart(document.getElementById('sparkline3').getContext('2d'), {
            type: 'line', data: { labels: ['T-3', 'T-2', 'T-1', 'Actuel'], datasets: [{ data: [25, 20, 15, 10], borderColor: '#10b981' }] }, options: sparklineOptions
        });
        new Chart(document.getElementById('sparkline4').getContext('2d'), {
            type: 'line', data: { labels: ['T-3', 'T-2', 'T-1', 'Actuel'], datasets: [{ data: [1.6, 1.5, 1.5, 1.5], borderColor: '#6b7280' }] }, options: sparklineOptions
        });

        // Main Charts Configurations
        const mainChartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { grid: { color: 'rgba(0,0,0,0.05)' }, border: { dash: [5, 5] }, beginAtZero: true },
                x: { grid: { display: false } }
            },
            elements: {
                point: { radius: 4, backgroundColor: '#fff', borderWidth: 2 },
                line: { tension: 0.3, borderWidth: 3 }
            }
        };

        new Chart(document.getElementById('chart1').getContext('2d'), {
            type: 'line',
            data: {
                labels: ['T-3', 'T-2', 'T-1', 'Actuel'],
                datasets: [{ data: [80, 50, 40, 20], borderColor: '#3b82f6', pointBorderColor: '#3b82f6', fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }]
            },
            options: mainChartOptions
        });

        new Chart(document.getElementById('chart2').getContext('2d'), {
            type: 'line',
            data: {
                labels: ['T-3', 'T-2', 'T-1', 'Actuel'],
                datasets: [{ data: [15, 12, 10, 14], borderColor: '#8b5cf6', pointBorderColor: '#8b5cf6', fill: true, backgroundColor: 'rgba(139, 92, 246, 0.1)' }]
            },
            options: mainChartOptions
        });

        new Chart(document.getElementById('chart3').getContext('2d'), {
            type: 'line',
            data: {
                labels: ['T-3', 'T-2', 'T-1', 'Actuel'],
                datasets: [{ data: [3.5, 2.8, 1.8, 1.2], borderColor: '#14b8a6', pointBorderColor: '#14b8a6', fill: true, backgroundColor: 'rgba(20, 184, 166, 0.1)' }]
            },
            options: mainChartOptions
        });
    </script>
</body>
</html>
